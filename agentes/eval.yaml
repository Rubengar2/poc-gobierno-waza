name: security-agent-eval
skill: security-reviewer
schemaVersion: "1.2"
version: "1.0"

config:
  # Cambiamos a OpenAI y elegimos el modelo más económico y rápido
  engine_type: openai
  model_id: gpt-4o-mini
  timeout_sec: 60
  runs_per_test: 1

graders:
  - name: formato_respuesta
    type: json_schema
    config:
      schema_file: output_schema.json
      extract_json: true
      
  # NUEVO: LLM-as-a-Judge para detectar alucinaciones
  - name: juez_alucinaciones
    type: prompt
    config:
      prompt: |
        Eres un auditor de calidad estricto. Revisa la salida del agente: {output}.
        El contexto original era: {input}.
        ¿El agente inventó alguna vulnerabilidad o recomendación que no estaba en el contexto original?
        Responde estrictamente "PASS" si la respuesta es fiel al contexto (sin alucinaciones).
        Responde estrictamente "FAIL" si el agente inventó información.

tasks:
  - "tasks/*.yaml"
