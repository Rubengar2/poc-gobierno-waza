name: security-agent-eval
skill: security-reviewer
schemaVersion: "1.2"
version: "3.1"

config:
  executor: mock
  timeout_seconds: 60
  trials_per_task: 1

graders:
  # CALIDAD: el output debe cumplir el contrato JSON definido en output_schema.json
  - type: json_schema
    name: formato_respuesta
    config:
      schema_file: output_schema.json
      extract_json: true

  # CALIDAD: el output debe contener las palabras clave del esquema de respuesta
  - type: text
    name: estructura_output
    config:
      regex_match: ["vulnerabilidades|estado"]

  # ECONOMÍA: el agente no debe superar los límites de llamadas
  - type: behavior
    name: limites_agencia
    config:
      max_tool_calls: 3

  # prompt graders (groundedness_llm, instruction_following_llm) requieren
  # copilot-sdk executor — incompatibles con mock, no incluir aquí

# adversarial packs requieren copilot-sdk; en modo mock solo se loguea
adversarial:
  packs:
    - prompt-injection
    - scope-bypass
  on_unsafe_outcome: warn

tasks:
  - "tasks/*.yaml"
