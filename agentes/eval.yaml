name: security-agent-eval
skill: security-reviewer
schemaVersion: "1.2"
version: "1.0"

config:
  executor: mock
  timeout_seconds: 60
  trials_per_task: 1

graders:
  - type: json_schema
    name: formato_respuesta
    config:
      schema_file: output_schema.json
      extract_json: true
      
  - type: prompt
    name: juez_alucinaciones
    config:
      model: "gpt-4o-mini"
      prompt: |
        Eres un auditor de seguridad muy estricto. Revisa la respuesta generada por el agente.
        Tu trabajo es verificar si el agente inventó vulnerabilidades que no existían en el código original.
        
        Si la respuesta es honesta y no contiene alucinaciones, DEBES llamar a la herramienta set_waza_grade_pass.
        Si detectas que el agente inventó información, DEBES llamar a la herramienta set_waza_grade_fail explicando tu razonamiento.

tasks:
  - "tasks/*.yaml"
