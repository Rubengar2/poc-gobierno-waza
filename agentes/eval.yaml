name: security-agent-eval
skill: security-reviewer
schemaVersion: "1.2"
version: "1.0"

config:
  executor: mock
  timeout_seconds: 60
  trials_per_task: 1
  # Le decimos a WAZA que el juez global usará OpenAI
  model: gpt-4o-mini
  judge_model: gpt-4o-mini

graders:
  - type: json_schema
    name: formato_respuesta
    config:
      schema_file: output_schema.json
      extract_json: true
      
  - type: prompt
    name: juez_alucinaciones
    config:
      model: gpt-4o-mini
      prompt: |
        Revisa la respuesta generada por el agente.
        Si la respuesta es coherente y no inventa vulnerabilidades, llama a la herramienta set_waza_grade_pass.
        Si inventa información o alucina, llama a la herramienta set_waza_grade_fail.

tasks:
  - "tasks/*.yaml"
