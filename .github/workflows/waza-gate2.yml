name: Gate 2 - Governance Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agentes/**/*.agent.md'
      - 'agentes/eval.yaml'
      - 'agentes/tasks/**'

jobs:
  evaluar-calidad-economia:
    name: evaluar-calidad-economia
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar WAZA CLI
        run: |
          npm install -g @waza/cli || npm install -g waza

      - name: Control de Presupuesto de Tokens
        run: |
          waza tokens check ./agentes/

      - name: Ejecutar Pruebas Determinísticas (WAZA)
        continue-on-error: true
        run: |
          cd agentes
          waza run eval.yaml --output results.json --verbose

      - name: Analizar Resultados e Integrar Score (Híbrido)
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/gate2_scorer.py agentes/results.json
