name: Gate 2 - Governance Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agentes/**/*.agent.md'
      - 'agentes/eval.yaml'
      - 'agentes/tasks/**'
      - 'scripts/gate2_scorer.py'

jobs:
  evaluar-calidad-economia:
    name: evaluar-calidad-economia
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio con Historial Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar WAZA CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.sh | bash

      - name: Identificar Agentes a Evaluar (Delta Check)
        id: delta
        run: |
          GLOBAL_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E 'scripts/gate2_scorer.py|agentes/eval.yaml' || true)
          
          if [ -n "$GLOBAL_CHANGES" ]; then
            echo "⚠️ Reglas globales modificadas. Se evaluarán TODOS los agentes."
            TARGETS=$(ls agentes/*.agent.md | tr '\n' ' ')
          else
            TARGETS=$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD | grep -E '^agentes/.*\.agent\.md$' | tr '\n' ' ' || true)
          fi
          
          echo "ARCHIVOS_A_EVALUAR=$TARGETS" >> $GITHUB_ENV

      - name: Control de Presupuesto de Tokens
        run: |
          waza tokens check ./agentes/

      - name: Ejecutar Pruebas Determinísticas (WAZA)
        continue-on-error: true
        run: |
          cd agentes
          waza run eval.yaml --output results.json --verbose

      - name: Analizar Resultados e Integrar Score Granular
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for agent in $ARCHIVOS_A_EVALUAR; do
            echo "----------------------------------------------------"
            echo "PROCESANDO AGENTE: $agent"
            python scripts/gate2_scorer.py "$agent" "agentes/results.json"
          done

      - name: Persistir Reportes de Auditoría en el Repositorio
        if: always()
        run: |
          git config --global user.name "Gate 2 Governance Bot"
          git config --global user.email "governance-bot@enterprise.com"
          git add agentes/reports/
          
          if git diff --staged --quiet; then
            echo "Sin cambios en los reportes de auditoría."
          else
            git commit -m "docs(gate2): actualizar reportes de auditoria [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
