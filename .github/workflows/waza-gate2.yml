name: Gate 2 - Governance Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  evaluar-calidad-economia:
    name: evaluar-calidad-economia
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Permite al bot publicar comentarios en el PR

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar WAZA CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.sh | bash

      - name: Identificar Agentes a Evaluar (Delta Check)
        id: delta
        run: |
          GLOBAL_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E 'scripts/gate2_scorer.py|agentes/eval.yaml' || true)
          
          if [ -n "$GLOBAL_CHANGES" ]; then
            echo "⚠️ Reglas globales modificadas. Se evaluarán TODOS los agentes."
            TARGETS=$(ls agentes/*.agent.md | tr '\n' ' ')
          else
            TARGETS=$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD | grep -E '^agentes/.*\.agent\.md$' | tr '\n' ' ' || true)
          fi

          if [ -z "$TARGETS" ]; then
            echo "ℹ️ No hay deltas específicos. Evaluando agentes disponibles."
            TARGETS=$(ls agentes/*.agent.md | tr '\n' ' ')
          fi
          
          echo "ARCHIVOS_A_EVALUAR=$TARGETS" >> $GITHUB_ENV

      - name: Control de Presupuesto de Tokens
        continue-on-error: true
        run: |
          waza tokens check ./agentes/ || echo "⚠️ Token check no aplicable con la configuración actual."

      - name: Ejecutar Pruebas Determinísticas (WAZA)
        id: waza_run
        continue-on-error: true
        run: |
          cd agentes
          waza run eval.yaml --output results.json --verbose

      - name: Ejecutar Tests Adversariales (WAZA)
        continue-on-error: true
        run: |
          cd agentes
          waza adversarial --spec eval.yaml --output adversarial.json || echo "⚠️ Adversarial packs requieren copilot-sdk. Omitido con mock executor."

      - name: Analizar Resultados e Integrar Score Granular
        if: steps.waza_run.outcome != 'skipped'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "--- results.json (primeras 40 líneas) ---"
          head -40 agentes/results.json 2>/dev/null || echo "(no results.json)"
          echo "-----------------------------------------"
          EXIT_CODE=0
          for agent in $ARCHIVOS_A_EVALUAR; do
            echo "----------------------------------------------------"
            echo "PROCESANDO AGENTE: $agent"
            python scripts/gate2_scorer.py "$agent" "agentes/results.json" "agentes/adversarial.json" || EXIT_CODE=1
          done
          exit $EXIT_CODE

      - name: Publicar Reporte de Auditoría como Comentario en el PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Consolidar todos los reportes LATEST generados en un solo archivo temporal
          if [ -d "agentes/reports" ]; then
            cat agentes/reports/*/LATEST.md > report_summary.md 2>/dev/null || true
            if [ -s "report_summary.md" ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body-file report_summary.md || echo "No se pudo publicar comentario en el PR."
            fi
          fi

      - name: Adjuntar Reportes como Artefactos de la Ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-audit-reports
          path: agentes/reports/
